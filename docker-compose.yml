services:

  mysql:
    image: mysql:8.4
    container_name: decisionhypersaro_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: decisionhypersaro_db

    ports:
      - "3309:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  laravel:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: decisionhypersaro_app

    restart: unless-stopped

    depends_on:
      - mysql

    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:latest

    container_name: decisionhypersaro_nginx

    restart: unless-stopped

    depends_on:
      - laravel

    ports:
      - "8200:80"

    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  mysql_data: